name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      simulate_regression:
        description: "Échec volontaire : dégrade l'entraînement pour vérifier que la CI le détecte"
        type: boolean
        default: false
      run_full_qualification:
        description: "Lancer la qualification complète sur le jeu Kaggle (secrets requis)"
        type: boolean
        default: false
  schedule:
    - cron: "17 3 * * 1" # chaque lundi : qualification complète

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  AITG_SIMULATE_REGRESSION: ${{ inputs.simulate_regression && '1' || '0' }}

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install ruff==0.17.6
      - run: ruff check --output-format=github .
      - run: ruff format --check .

  tests:
    name: tests rapides (pytest + couverture)
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Installer les dépendances
        run: pip install -r requirements.txt
      - name: Pytest (hors tests lents)
        run: >
          pytest -m "not slow"
          --cov=app --cov-report=term-missing --cov-report=xml
          --cov-fail-under=85
          --junitxml=junit.xml
      - name: Résumé de couverture
        if: always()
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET, os
          if os.path.exists("coverage.xml"):
              rate = float(ET.parse("coverage.xml").getroot().get("line-rate")) * 100
              print(f"### Couverture des lignes : {rate:.1f} %")
          EOF
      - name: Conserver les preuves
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            junit.xml
            coverage.xml

  full-qualification:
    name: qualification complète (jeu Kaggle)
    runs-on: ubuntu-latest
    needs: tests
    if: github.event_name == 'schedule' || inputs.run_full_qualification
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt kaggle
      - name: Télécharger le jeu de données (identifiants en secrets, jamais dans le dépôt)
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          kaggle datasets download -d mlg-ulb/creditcardfraud -p data --unzip
          echo "76274b691b16a6c49d3f159c883398e03ccd6d1ee12d9d8ee38f4b4b98551a89  data/creditcard.csv" | sha256sum -c -
      - run: pytest -m slow
      - run: python scripts/run_experiments.py --data data/creditcard.csv --out reports/ci_run
      - run: python scripts/run_robustness.py --data data/creditcard.csv --out reports/ci_run
      - run: python scripts/benchmark.py --out reports/ci_run
      - run: python scripts/compare_baseline.py --data data/creditcard.csv --out reports/ci_run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qualification-report
          path: reports/ci_run
